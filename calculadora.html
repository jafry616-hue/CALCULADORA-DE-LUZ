<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Propinas</title>
    <link rel="stylesheet" href="ccs/styles.css">
</head>
<body>

<div class="calculadora">
    <h1>Calculadora de Propinas</h1>

    <label for="cuenta">Total de la cuenta ($):</label>
    <input type="number" id="cuenta" placeholder="Ej: 100" min="0">

    <label for="porcentaje">Porcentaje de propina:</label>
    <select id="porcentaje">
        <option value="10">10%</option>
        <option value="15" selected>20%</option>
        <option value="20">20%</option>
        <option value="25">25%</option>
    </select>

    <label for="personas">Número de personas:</label>
    <input type="number" id="personas" placeholder="Ej: 100" min="1" value="1">

    <button onclick="calcular()">luz amanda</button>

    <div class="resultado" id="resultado"></div>
</div>

<script src="js/script.js"></script>

</body>
</html>

<script src="javascript/java.js"></script>
</body>
</html>
